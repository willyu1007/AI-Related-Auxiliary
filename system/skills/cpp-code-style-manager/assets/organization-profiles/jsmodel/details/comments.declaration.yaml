id: comments.declaration
config:
  requirement:
  - '头文件首行开始中文文件职责注释，然后才是 #pragma once 等预处理指令'
  - 类、结构体、枚举、函数必须有中文 Doxygen；先说明中文对象名称，再解释职责和必要用法，避免无信息的“定义 XXX”
  - 仅在 cpp 中声明实现的辅助函数也需要注释；公共头文件已有声明注释时，cpp 定义不重复
  - 类/结构体成员变量与枚举值在声明同行写中文注释，同组对齐
  - 只使用 @brief、@details、@param、@return、@tparam、@file；普通中文简介不强制写 @brief
  - 不使用 @class、@struct、@enum 或旧 @pre/@post/@failure/@invariant 标签；有价值的旧内容改成普通中文说明
  - 模板参数、参数、返回值描述与声明一致；补充意图、边界、生命周期、所有权和失败语义
  - 正文采用英文标点，行尾不加句号；保留代码标识、正式协议/产品名称、路径和无稳定译名的术语
  - 名称已足够清楚时不添加套话；已有稳定中文名称的项目概念优先使用该中文名称
